name: Zitara
options:
  bundleIdPrefix: com.aniruth    # must be unique per Apple ID for free provisioning
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  Zitara:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    scheme:
      testTargets:
        - ZitaraTests
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Audio/Bridge/Zitara-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_ENABLE_MODULES: YES
        TARGETED_DEVICE_FAMILY: "2"          # iPad only
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: XXXXXXXXXX       # Set in Xcode (Signing & Capabilities) with your free Apple ID
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Zitara
        # No encryption beyond what the OS provides — skips the export
        # compliance question on every App Store Connect upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  ZitaraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Tests
    dependencies:
      - target: Zitara
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
